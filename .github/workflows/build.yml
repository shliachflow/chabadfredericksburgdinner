name: Build site from content

# Keeps index.html, llms.txt and sitemap.xml in step with content/site.json.
# The Gala site editor already publishes these files itself; this covers edits made another way (for example Pages CMS).

on:
  push:
    branches: [main]
    paths: ['content/**', 'src/**', 'build.js']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: node build.js
      - name: Commit rebuilt files (only if something changed)
        run: |
          if [ -n "$(git status --porcelain index.html llms.txt sitemap.xml)" ]; then
            git config user.name "gala-site-bot"
            git config user.email "actions@users.noreply.github.com"
            git add index.html llms.txt sitemap.xml
            git commit -m "Rebuild site from content [skip ci]"
            git push
            # a push made with the built-in token does not always trigger Pages, so ask for a build explicitly
            curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
          fi
